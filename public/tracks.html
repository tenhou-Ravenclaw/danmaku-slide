<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>トラックを選ぶ</title>
<link rel="icon" href="/icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/css/app.css">
<style>
  body { min-height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  main { flex: 1; display: flex; flex-direction: column; padding: 1.75rem 1.25rem;
         max-width: 32rem; width: 100%; margin: 0 auto; }
  #event { font-size: var(--t-sm); color: var(--muted); }
  h1 { font-size: var(--t-2xl); font-weight: 800; line-height: 1.35; margin: .2rem 0 1.25rem; }

  #list { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
  /* 暗い客席で、歩きながら片手で押す。行はひとつずつ大きく取る。 */
  #list a {
    display: flex; align-items: center; gap: .9rem; text-decoration: none; color: var(--ink);
    min-height: 68px; padding: .9rem 1.1rem; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--line);
  }
  #list a:hover, #list a:focus-visible { background: var(--surface2); border-color: var(--line2); }
  #list .t { font-size: var(--t-xl); font-weight: 700; letter-spacing: -.02em; }
  #list .chev { margin-left: auto; color: var(--muted); flex: none; font-size: 1.2rem; }
  #note { margin: 0; font-size: var(--t-sm); color: var(--muted); }
  #note[data-kind="bad"] { color: var(--bad); }
  footer { margin-top: auto; padding-top: 2rem; font-size: var(--t-xs); color: var(--muted); }
</style>

<main>
  <div id="event">—</div>
  <h1 id="heading">どの部屋にいますか</h1>
  <ul id="list"></ul>
  <p id="note" data-kind=""></p>
  <footer>部屋の入口にQRがあれば、そちらを読み取ると直接開けます。</footer>
</main>

<script type="module" src="/tracks.boot.mjs"></script>
</html>
