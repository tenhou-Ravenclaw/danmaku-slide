<!doctype html>
<html lang="ja" class="dark">
<meta charset="utf-8">
<title>弾幕スライド</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<link rel="stylesheet" href="./css/app.css">
<style>
  body { min-height: 100dvh; display: grid; place-items: center; }
  main { max-width: 30rem; padding: 2rem 1.25rem; }
  h1 { font-size: 1.5rem; font-weight: 700; }
  p.lead { margin: .3rem 0 2rem; color: var(--muted); font-size: .92rem; }
  .choices { display: grid; gap: .7rem; }
  .choices a { display: block; padding: 1rem 1.1rem; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .choices a:hover, .choices a:focus-visible { background: var(--surface2); }
  .choices .t { font-weight: 700; }
  .choices .s { font-size: .85rem; color: var(--muted); margin-top: .1rem; }
  .foot { margin-top: 2rem; font-size: .82rem; color: var(--muted); }
</style>
<main>
  <h1>弾幕スライド</h1>
  <p class="lead">登壇中のスライドにコメントを重ねて流します。</p>
  <div class="choices">
    <a href="./organizer.html">
      <div class="t">イベントを作る</div>
      <div class="s">トラックを並べて、登壇者にリンクを配ります</div>
    </a>
    <a href="./app.html">
      <div class="t">重ねるアプリを入手する</div>
      <div class="s">スライドの上に弾幕を重ねます</div>
    </a>
  </div>
  <p class="foot">コメントを送る方は、会場のQRコードを読み取ってください。</p>
</main>
</html>
