<!doctype html>
<html lang="ja" class="dark">
<meta charset="utf-8">
<title>弾幕を送る</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<link rel="stylesheet" href="./css/app.css">
<style>
  body { min-height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  main { flex: 1; display: flex; flex-direction: column; gap: .6rem; padding: 1.25rem; max-width: 32rem; width: 100%; margin: 0 auto; }

  #track { font-size: 1.15rem; font-weight: 700; }
  #title { font-size: .92rem; color: var(--ink2); margin-bottom: .5rem; }

  /* 16px 未満だと iOS が勝手に拡大し、送信ボタンが画面外へ出る */
  #text { min-height: 7rem; font-size: 1rem; background: var(--surface2); }
  #text[data-over="1"] { border-color: var(--bad); }
  #count { align-self: flex-end; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  #count[data-over="1"] { color: var(--bad); font-weight: 700; }

  #send { padding: .95rem; font-size: 1rem; background: var(--surface2); color: var(--ink);
          border: 1px solid var(--line2); }
  #send:not(:disabled) { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  #note { min-height: 2.6rem; margin: 0; font-size: .85rem; color: var(--muted); }
  #note[data-kind="ok"]   { color: var(--good); }
  #note[data-kind="wait"] { color: var(--warn); }
  #note[data-kind="bad"]  { color: var(--bad); }
</style>

<main>
  <div>
    <div id="track">—</div>
    <div id="title">接続中…</div>
  </div>

  <textarea id="text" rows="4" placeholder="コメントを入力"
    enterkeyhint="send" autocomplete="off" autocapitalize="off"></textarea>
  <span id="count" data-over="">0 / 60</span>

  <button id="send" class="btn block" disabled>送信</button>
  <p id="note" data-kind="">送るとスライドの上に流れます</p>
</main>

<script type="module">
  const note = document.getElementById('note');
  const show = (m) => { note.textContent = `エラー: ${m}`; note.dataset.kind = 'bad'; };
  addEventListener('error', (e) => show(e.message ?? e.error));
  addEventListener('unhandledrejection', (e) => show(e.reason?.message ?? e.reason));
  try {
    const q = new URLSearchParams(location.search);
    const { createPoster } = await import('./lib/poster.mjs');
    window.__poster = await createPoster({ eventId: q.get('e'), trackId: q.get('t') });
  } catch (e) { show(e?.message ?? e); }
</script>
</html>
