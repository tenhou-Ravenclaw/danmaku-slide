<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>コメントを送る</title>
<link rel="icon" href="/icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0d13" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="./css/app.css">
<style>
  body { min-height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  main { flex: 1; display: flex; flex-direction: column; gap: .55rem; padding: 1.25rem;
         max-width: 32rem; width: 100%; margin: 0 auto; }

  .head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin-bottom: .3rem; }
  #track { font-size: var(--t-xl); font-weight: 700; letter-spacing: -.02em; }
  /* 受付中かどうか。暗い客席で最初に探すのはここ。 */
  #title { font-size: var(--t-sm); font-weight: 700; color: var(--good); }
  #title[data-kind="wait"] { color: var(--bad); }
  #title[data-kind="dead"] { color: var(--muted); font-weight: 400; }

  label.field > span { font-size: var(--t-sm); }

  /* 送ったものを重ねて飛ばすので、ここを基準にする。 */
  label.field { position: relative; }
  /* 16px 未満だと iOS が勝手に拡大し、送信ボタンが画面外へ出る。
     ルートの文字が 15px なので rem では足りない。実寸で指定する。 */
  #text { min-height: 5.5rem; font-size: 16px; background: var(--surface2); line-height: 1.6; }
  #text[data-over="1"] { border-color: var(--bad); }
  #text:focus { background: var(--surface); }

  /* 送ったものは上へ抜ける。
     横に流すと弾幕の向きに揃うが、投稿する人はスライドを見ていない。
     手元から離れて出ていく向きのほうが、何も知らなくても「送られた」と読める。 */
  .fly {
    position: absolute; z-index: 2; max-width: 100%;
    font-size: 16px; font-weight: 700; color: var(--ink); pointer-events: none;
    white-space: nowrap; overflow: hidden;
    animation: fly .5s cubic-bezier(.3, 0, .6, 1) forwards;
  }
  @keyframes fly {
    to { transform: translateY(-2.2rem); opacity: 0; }
  }

  #count { align-self: flex-end; font-size: var(--t-xs); color: var(--muted);
           font-variant-numeric: tabular-nums; }
  #count[data-over="1"] { color: var(--bad); font-weight: 700; }

  /* 指で押すものなので 48px を下回らせない。 */
  #send { position: relative; overflow: hidden; min-height: 50px; padding: .95rem;
          font-size: 1rem; background: var(--surface2); color: var(--ink);
          border: 1px solid var(--line2); }
  #send:not(:disabled) { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  /* 待ち時間は秒数だけでなく、溜まっていく帯でも出す。
     数字が 2 から 1 に変わるまでのあいだ、何も動かないと止まって見える。
     減るのではなく溜まる向きにする。満ちたら押せる、が一目で分かる。

     帯の状態は3つ。伸びている／消えていく／何も無い。

     伸びる動きと消える動きを同じ遷移に載せると、次に送ったとき、
     満ちたままの帯が 0 へ戻るのが見えてしまう（一瞬左へ動く）。
     消えるときは幅を動かさず、満ちたまま薄くする。縮めると取り消されたように見える。
     「何も無い」には遷移を持たせない。幅を 0 に戻すのはここでやる。 */
  #sendFill { position: absolute; inset: 0; transform-origin: left; z-index: 0;
              transform: scaleX(var(--p, 0)); background: var(--good-bg); opacity: 0; }
  #send[data-wait="1"]    #sendFill { opacity: 1; transition: transform .2s linear; }
  /* 消えていく間も、残りを前へ伸ばしきる。
     前へ動くぶんには取り消されたようには見えないし、
     止めると最後の一割が飛んで見える。 */
  #send[data-wait="done"] #sendFill { opacity: 0;
              transition: transform .2s linear, opacity .45s ease; }
  #sendLabel { position: relative; z-index: 1; }

  #note { min-height: 2.6rem; margin: 0; font-size: var(--t-sm); color: var(--muted); }
  #note[data-kind="ok"]   { color: var(--good); }
  #note[data-kind="wait"] { color: var(--warn); }
  #note[data-kind="bad"]  { color: var(--bad); }

</style>

<main>
  <div class="head">
    <div id="track">—</div>
    <div id="title" data-kind="dead">接続中…</div>
  </div>

  <!-- ラベルは見えるところに置く。placeholder は打ち始めた瞬間に消えるので、
       それだけに頼ると「何の欄だったか」が分からなくなる。
       送れない理由は aria-describedby で入力欄に紐づける。
       離れた場所に出すと、何が悪いのかが結びつかない。 -->
  <label class="field" for="text"><span>コメント</span>
    <textarea id="text" rows="3"
      enterkeyhint="send" autocomplete="off" autocapitalize="off"
      aria-describedby="count note"></textarea></label>
  <span id="count" data-over="">0 / 60</span>

  <button id="send" class="btn block" disabled>
    <span id="sendFill" aria-hidden="true"></span><span id="sendLabel">送信</span>
  </button>
  <!-- 状態が変わったことを読み上げる。番号だけでなく文として伝える。 -->
  <p id="note" data-kind="" role="status" aria-atomic="true">送るとスライドの上に流れます</p>

</main>

<script type="module" src="/post.boot.mjs"></script>
</html>
