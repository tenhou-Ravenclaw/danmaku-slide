<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>登壇する</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="./css/app.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }

  /* 上バーは登壇中ずっと見える。ここに全部置き、下はコメントだけにする。 */
  .bar {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: .75rem 1.25rem; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .bar .who { min-width: 8rem; }
  .bar .who .t { font-size: 1.25rem; font-weight: 700; line-height: 1.3; }
  .bar .who .s { font-size: .8rem; color: var(--muted); }
  .bar .spacer { flex: 1; }

  /* 箱の中は「見出し＋下の一行」。中身の出し分けは JS がやる。 */
  .lines, #state { display: flex; flex-direction: column; min-width: 0; }
  .lines .t { font-weight: 700; font-size: .9rem; line-height: 1.35; }
  .lines .s { font-size: .75rem; color: var(--muted); line-height: 1.4; }
  .lines .s:empty { display: none; }

  .statebox {
    display: flex; align-items: center; gap: .55rem;
    padding: .4rem .9rem; border-radius: 8px;
    background: var(--surface2); border: 1px solid var(--line);
  }
  .statebox .dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--muted); flex: none; }
  .statebox[data-kind="live"]    .dot { background: var(--good); box-shadow: 0 0 0 4px var(--good-bg); }
  .statebox[data-kind="stopped"] { background: var(--bad-bg); border-color: var(--bad); }
  .statebox[data-kind="stopped"] .dot { background: var(--bad); border-radius: 2px; box-shadow: none; }
  .statebox[data-kind="stopped"] .t,
  .statebox[data-kind="stopped"] .s { color: var(--bad); }
  .statebox[data-kind="error"] { background: var(--bad-bg); border-color: var(--bad); }
  .statebox[data-kind="error"] .dot { background: var(--bad); }

  /* 流しているかどうか。登壇前に一度決めたら、あとは見るだけになる。 */
  .flowbox {
    display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
    padding: .5rem .5rem .5rem .9rem; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--line);
  }
  /* まだ流していない間だけ、ここが画面でいちばん強い */
  .flowbox[data-state="idle"] { border-color: var(--accent); border-width: 2px; padding: calc(.5rem - 1px) calc(.5rem - 1px) calc(.5rem - 1px) calc(.9rem - 1px); }
  .flowbox[data-state="live"] { background: var(--surface2); }
  .flowbox[data-state="live"] .t { color: var(--good); }
  .flowbox .mark { flex: none; display: grid; place-items: center; width: 1.4rem; height: 1.4rem; }
  .flowbox .mark svg { width: 100%; height: 100%; display: block; }
  .flowbox .acts { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .flowbox .acts .btn { min-height: 44px; font-size: .88rem; padding: .5rem .9rem; }
  .flowbox .acts a.plain { font-size: .82rem; white-space: nowrap; }
  /* 流れているあいだは選択肢を畳む。押し直したい人は「流し方を変える」から */
  .flowbox[data-state="live"]:not([data-acts="1"]) #flowActs { display: none; }
  .flowbox:not([data-state="live"]) #flowDone,
  .flowbox[data-acts="1"] #flowDone { display: none; }

  main { flex: 1; display: block; padding: 1.25rem;
         max-width: 70rem; width: 100%; margin: 0 auto; }

  /* コメント一覧。この画面の主役。 */
  .feedcard { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .feedhead { display: flex; align-items: baseline; gap: .6rem;
              padding: .85rem 1.1rem; border-bottom: 1px solid var(--line); }
  .feedhead h2 { font-size: 1rem; font-weight: 700; }
  .feedhead .n { margin-left: auto; font-size: .85rem; color: var(--muted);
                 font-variant-numeric: tabular-nums; }
  #feed { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 72vh; }
  #feed li { display: flex; gap: 1rem; align-items: baseline;
             padding: .75rem 1.1rem; border-bottom: 1px solid var(--line); }
  #feed li:last-child { border-bottom: 0; }
  /* いちばん新しい1件だけ地を変える。どれが今来たのかが分かる。 */
  #feed li:first-child { background: var(--surface2); }
  #feed .at { flex: none; width: 4.5rem; font-size: .75rem; color: var(--muted);
              font-variant-numeric: tabular-nums; }
  #feed .tx { font-size: 1.08rem; word-break: break-word; }
  #feedEmpty { padding: 2.5rem 1.1rem; text-align: center; color: var(--muted); font-size: .9rem; }
</style>

<div class="bar">
  <div class="who">
    <div class="t" id="trackName">—</div>
    <div class="s" id="eventName">—</div>
  </div>

  <div class="statebox" id="statebox" data-kind="">
    <span class="dot" aria-hidden="true"></span>
    <div class="lines">
      <!-- 読み上げるのはここだけ。状態が変わったときに1回。
           止まっている理由は変わらないので、状態と一緒に読み上げる。 -->
      <div id="state" role="status" aria-atomic="true">
        <span class="t" id="stateText">読み込み中</span>
        <span class="s" id="stateReason"></span>
      </div>
      <!-- 「最後のコメント 3秒前」は毎秒書き換わる。読み上げに混ぜると
           登壇中ずっと喋り続けることになるので、読み上げの木から外す。 -->
      <span class="s" id="stateSub" aria-hidden="true"></span>
    </div>
  </div>

  <span class="spacer"></span>

  <div class="flowbox" id="flowbox" data-state="idle">
    <span class="mark" id="flowMark" aria-hidden="true"></span>
    <div class="lines">
      <div class="t" id="flowTitle">スライドにまだ流していません</div>
      <div class="s" id="flowSub">観客のコメントがスライドの上を流れます</div>
    </div>
    <div class="acts" id="flowActs">
      <a id="openApp" class="btn primary" href="#">アプリで流す</a>
      <a id="browserWay" class="btn" href="#">ブラウザで流す</a>
      <a id="getApp" class="plain" href="./app.html">アプリを入手</a>
    </div>
    <div class="acts" id="flowDone">
      <button id="changeWay" class="btn" type="button">流し方を変える</button>
    </div>
  </div>
</div>

<main>
  <section class="card feedcard">
    <div class="feedhead">
      <h2>届いているコメント</h2>
      <!-- 数字だけでは意味が伝わらないので、読み上げには文として渡す。
           目で見るぶんには見出しが隣にあるので「214 件」で足りる。 -->
      <span class="n" id="countLabel"><span id="count">0</span> 件<span class="visually-hidden"> 届いています</span></span>
    </div>
    <ul id="feed"></ul>
    <div id="feedEmpty">まだ届いていません</div>
  </section>
</main>

<script type="module">
  const stateText = document.getElementById('stateText');
  const statebox = document.getElementById('statebox');
  const show = (m) => { stateText.textContent = `エラー: ${m}`; statebox.dataset.kind = 'error'; };
  addEventListener('error', (e) => show(e.message ?? e.error));
  addEventListener('unhandledrejection', (e) => show(e.reason?.message ?? e.reason));
  try {
    const q = new URLSearchParams(location.search);
    const { createStage } = await import('./lib/stage.mjs');
    window.__stage = await createStage({
      eventId: q.get('e'), trackId: q.get('t'),
    });
  } catch (e) { show(e?.message ?? e); }
</script>
</html>
