<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>登壇する</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="./css/app.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }

  /* 上バーは登壇中ずっと見える。状態と「止める」だけ。 */
  .bar {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: .9rem 1.25rem; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .bar .who { min-width: 8rem; }
  .bar .who .t { font-size: 1.25rem; font-weight: 700; line-height: 1.3; }
  .bar .who .s { font-size: .8rem; color: var(--muted); }
  .bar .spacer { flex: 1; }
  .state { display: flex; align-items: center; gap: .55rem; padding: .45rem .9rem;
           border-radius: 8px; background: var(--surface2); }
  .state .dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--muted); flex: none; }
  .state .t { font-weight: 700; font-size: .9rem; }
  .state .s { font-size: .75rem; color: var(--muted); }
  .state[data-kind="live"]    .dot { background: var(--good); box-shadow: 0 0 0 4px rgba(95,211,154,.16); }
  .state[data-kind="stopped"] .dot { background: var(--warn); }
  .state[data-kind="error"]   .dot { background: var(--bad); }
  #stopBtn { padding: .9rem 2rem; font-size: 1rem; }

  main { flex: 1; display: grid; gap: 1rem; grid-template-columns: 1fr; padding: 1.25rem;
         max-width: 70rem; width: 100%; margin: 0 auto; align-content: start; }
  @media (min-width: 60rem) { main { grid-template-columns: 24rem 1fr; } }

  .step { padding: 1rem 1.1rem; }
  .step h2 { display: flex; align-items: center; gap: .6rem; font-size: 1rem; font-weight: 700; }
  .step h2 .n { width: 1.5rem; height: 1.5rem; border-radius: 6px; display: grid; place-items: center;
                font-size: .78rem; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); }
  .step[data-state="done"] h2 .n { background: var(--good); color: #06180f; border-color: transparent; }
  .step[data-state="now"]  h2 .n { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .step .ok { margin-left: auto; font-size: .78rem; color: var(--good); font-weight: 600; }

  #openApp { margin-top: .9rem; }
  .sub { display: flex; gap: 1rem; margin-top: .6rem; font-size: .82rem; }

  #nowTitle { font-weight: 700; margin-top: .7rem; }
  #nowMeta { font-size: .82rem; color: var(--muted); }

  /* コメント一覧。登壇者が手元で見る。 */
  .feedcard { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .feedhead { display: flex; align-items: baseline; gap: .6rem;
              padding: .85rem 1.1rem; border-bottom: 1px solid var(--line); }
  .feedhead h2 { font-size: 1rem; font-weight: 700; }
  .feedhead .n { margin-left: auto; font-size: .85rem; color: var(--muted);
                 font-variant-numeric: tabular-nums; }
  #feed { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 60vh; }
  #feed li { display: flex; gap: 1rem; align-items: baseline;
             padding: .7rem 1.1rem; border-bottom: 1px solid var(--line); }
  #feed li:last-child { border-bottom: 0; }
  #feed .at { flex: none; width: 4.5rem; font-size: .75rem; color: var(--muted);
              font-variant-numeric: tabular-nums; }
  #feed .tx { font-size: 1.02rem; word-break: break-word; }
  #feedEmpty { padding: 2.5rem 1.1rem; text-align: center; color: var(--muted); font-size: .9rem; }
</style>

<div class="bar">
  <div class="who">
    <div class="t" id="trackName">—</div>
    <div class="s" id="eventName">—</div>
  </div>
  <div class="state" id="state" data-kind="">
    <span class="dot"></span>
    <span><span class="t" id="stateText">読み込み中</span><br><span class="s" id="stateSub"></span></span>
  </div>
  <span class="spacer"></span>
  <button id="stopBtn" class="btn danger">投稿を止める</button>
  <button id="resumeBtn" class="btn hidden" style="padding:.9rem 2rem">投稿を再開する</button>
</div>

<main>
  <div class="stack">
    <section class="card step" id="step1" data-state="now">
      <h2><span class="n">1</span> スライドに重ねる <span class="ok hidden" id="appOk">✓ アプリ接続中</span></h2>
      <a id="openApp" class="btn primary block lg" href="#">アプリで開く</a>
      <div class="sub">
        <a id="getApp" href="./app.html">アプリを入手</a>
        <a id="browserWay" href="#">ブラウザ版で続ける</a>
      </div>
    </section>

    <section class="card step" id="step2" data-state="">
      <h2><span class="n">2</span> 演題を入れて開始</h2>
      <div id="beforeStart" class="stack" style="margin-top:.7rem">
        <label class="field"><span>演題</span>
          <input id="title" maxlength="60" placeholder="はじめてのLT" autocomplete="off"></label>
        <label class="field"><span>登壇者</span>
          <input id="speaker" maxlength="40" placeholder="名前" autocomplete="off"></label>
        <button id="startBtn" class="btn primary block">この内容で開始</button>
      </div>
      <div id="afterStart" class="hidden">
        <div id="nowTitle">—</div>
        <div id="nowMeta">—</div>
        <button id="endBtn" class="btn" style="margin-top:.8rem">登壇を終える</button>
      </div>
    </section>
  </div>

  <section class="card feedcard">
    <div class="feedhead">
      <h2>届いているコメント</h2>
      <span class="n"><span id="count">0</span> 件</span>
    </div>
    <ul id="feed"></ul>
    <div id="feedEmpty">まだ届いていません</div>
  </section>
</main>

<script type="module">
  const stateText = document.getElementById('stateText');
  const state = document.getElementById('state');
  const show = (m) => { stateText.textContent = `エラー: ${m}`; state.dataset.kind = 'error'; };
  addEventListener('error', (e) => show(e.message ?? e.error));
  addEventListener('unhandledrejection', (e) => show(e.reason?.message ?? e.reason));
  try {
    const q = new URLSearchParams(location.search);
    const { createStage } = await import('./lib/stage.mjs');
    window.__stage = await createStage({
      eventId: q.get('e'), trackId: q.get('t'), code: q.get('k'),
    });
  } catch (e) { show(e?.message ?? e); }
</script>
</html>
