<!doctype html>
<meta charset="utf-8">
<title>弾幕スライド</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /*
   * 透過は html に当てる。body だけに当てると html の背景が残って黒く見える。
   * 貼り方C（透過ウィンドウ）では ?transparent=1 で呼ばれる。
   */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b0f; }
  html.transparent, html.transparent body { background: transparent; }

  #stage { position: fixed; inset: 0; display: block; }
  video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /*
   * 操作バー。投影に映るので、触っていないときは消える。
   * 下端に近づけると全画面のコントロールと喧嘩するので上に置く。
   */
  #bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
    padding: .7rem .9rem;
    background: linear-gradient(to bottom, rgba(8,8,12,.92), rgba(8,8,12,0));
    font: 500 13px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: #e8e8ef;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  body[data-bar="show"] #bar { opacity: 1; pointer-events: auto; }
  html.transparent #bar, html.no-bar #bar { display: none; }

  #bar button, #bar select {
    padding: .5rem .85rem; border-radius: .5rem; font: inherit; font-weight: 600;
    background: #1c1c26; color: #e8e8ef; border: 1px solid #333345; cursor: pointer;
  }
  #bar button.primary { background: #6f8cff; color: #0b0b12; border-color: transparent; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #bar .spacer { flex: 1; }
  #barMsg { color: #8a8a99; }
  #barMsg[data-kind="bad"] { color: #ff8f8f; }

  /* 何をすればいいか分からない状態を作らない */
  #empty {
    position: fixed; inset: 0; z-index: 2; display: grid; place-items: center;
    text-align: center; color: #8a8a99;
    font: 15px/1.9 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #empty strong { display: block; color: #e8e8ef; font-size: 1.15rem; margin-bottom: .35rem; }
  body[data-slide="1"] #empty, html.transparent #empty, html.no-bar #empty { display: none; }

  #hud {
    position: fixed; left: 12px; bottom: 12px; z-index: 2;
    max-width: calc(100vw - 24px);
    padding: 6px 12px; border-radius: 999px;
    font: 500 13px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: #cfd0dc; background: rgba(12, 12, 18, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.12);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #hud[data-kind="error"]   { color: #ffd2d2; background: rgba(120, 20, 20, 0.85); border-color: rgba(255,120,120,.4); }
  #hud[data-kind="stopped"] { color: #ffe6b8; background: rgba(110, 72, 10, 0.85); border-color: rgba(255,200,110,.35); }
  html.no-hud #hud { display: none; }

  /*
   * 全画面はユーザー操作からしか呼べない。親ウィンドウの操作は引き継がれないので、
   * この窓の中で1回だけ押してもらう。押したらもう触らなくていい。
   */
  #cover {
    position: fixed; inset: 0; z-index: 9; border: 0; cursor: pointer;
    display: grid; place-content: center; gap: .5rem; text-align: center;
    background: #0b0b0f; color: #e8e8ef;
    font: 600 1.4rem/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #cover small { font-size: .85rem; font-weight: 400; color: #8a8a99; }
  #cover[hidden] { display: none; }
</style>

<canvas id="stage"></canvas>
<video id="slide" playsinline muted></video>

<div id="empty">
  <div>
    <strong>スライドを選ぶと、その上に弾幕が流れます</strong>
    画面上部にカーソルを持っていくと操作が出ます
  </div>
</div>

<div id="bar">
  <button id="pick" class="primary">スライドを選ぶ</button>
  <button id="drop" hidden>取り込みをやめる</button>
  <select id="screen" hidden></select>
  <button id="full">全画面にする</button>
  <span class="spacer"></span>
  <span id="barMsg" data-kind=""></span>
</div>

<!-- 親ウィンドウから開かれたとき。全画面はこの窓の中で押さないと効かない。 -->
<button id="cover" hidden>
  <span>クリックして全画面にする</span>
  <small>このあとは触らなくていい</small>
</button>

<div id="hud" data-kind="ok">読み込み中</div>

<script type="module">
  // 読み込み自体が失敗したときも画面に出す。
  // PoC では module が黙って死んで原因が分からなかった。
  const hud = document.getElementById('hud');
  const show = (m) => { hud.textContent = `エラー: ${m}`; hud.dataset.kind = 'error'; };
  addEventListener('error', (e) => show(e.message ?? e.error));
  addEventListener('unhandledrejection', (e) => show(e.reason?.message ?? e.reason));

  const q = new URLSearchParams(location.search);
  if (q.get('transparent') === '1') document.documentElement.classList.add('transparent');
  if (q.get('hud') === '0') document.documentElement.classList.add('no-hud');
  if (q.get('bar') === '0') document.documentElement.classList.add('no-bar');

  try {
    const { createOverlay } = await import('./lib/overlay.mjs');
    const { mountBar } = await import('./lib/overlay-bar.mjs');
    const overlay = createOverlay({
      canvas: document.getElementById('stage'),
      video: document.getElementById('slide'),
      hud,
      eventId: q.get('e'),
      trackId: q.get('t'),
    });
    window.__overlay = overlay;
    mountBar(overlay, { autoPick: q.get('capture') === '1' });

    // 登壇者のコントロール画面から開かれた場合
    if (q.get('stage') === '1') {
      document.documentElement.classList.add('no-bar');
      const cover = document.getElementById('cover');
      cover.hidden = false;
      cover.addEventListener('click', async () => {
        try { await document.documentElement.requestFullscreen(); } catch {}
        cover.hidden = true;
      });
      // 親に「受け取れる」と伝える。映像は親が取り込んだものをそのまま渡してもらう。
      window.opener?.__projectorReady?.(overlay, window);
    }
  } catch (e) {
    show(e?.message ?? e);
  }
</script>
