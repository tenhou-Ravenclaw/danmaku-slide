<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { width: 320px; margin: 0; padding: 14px; background: #0b0b0f; color: #e8e8ef;
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  h1 { margin: 0 0 2px; font-size: .7rem; font-weight: 600; letter-spacing: .09em;
       text-transform: uppercase; color: #8a8a99; }
  p.lead { margin: 0 0 12px; font-size: .78rem; color: #8a8a99; }
  label { display: block; font-size: .72rem; color: #8a8a99; margin-bottom: 4px; }
  input { width: 100%; padding: 8px 10px; border-radius: 6px; font: inherit;
    background: #1c1c26; color: #e8e8ef; border: 1px solid #2a2a38; box-sizing: border-box; }
  input:focus-visible { outline: 2px solid #6f8cff; outline-offset: 1px; border-color: transparent; }
  button { width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 6px;
    font: inherit; font-weight: 700; background: #6f8cff; color: #0b0b12; cursor: pointer; }
  button.ghost { background: #1c1c26; color: #e8e8ef; border: 1px solid #2a2a38; font-weight: 600; }
  #msg { min-height: 1.3em; margin: 8px 0 0; font-size: .76rem; color: #8a8a99; }
  #msg[data-kind="ok"] { color: #5fd39a; }
  #msg[data-kind="bad"] { color: #ff8f8f; }

  /* いまどうなっているか */
  #state { margin-top: 12px; border-top: 1px solid #2a2a38; padding-top: 10px; }
  #verdict { display: flex; gap: 7px; align-items: flex-start; font-size: .82rem; }
  #verdict .dot { width: .55rem; height: .55rem; border-radius: 50%; background: #8a8a99;
                  flex: none; margin-top: .42rem; }
  #verdict[data-kind="ok"]   .dot { background: #5fd39a; }
  #verdict[data-kind="bad"]  .dot { background: #ff6b6b; }
  #verdict[data-kind="warn"] .dot { background: #ffc46b; }
  #fix { margin: 6px 0 0 1.05rem; font-size: .75rem; color: #8a8a99; }
  dl { margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;
       font-size: .72rem; }
  dt { color: #6a6a7a; white-space: nowrap; }
  dd { margin: 0; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  dl[hidden] { display: none; }
</style>

<h1>弾幕スライド</h1>
<p class="lead">Google スライドの発表に弾幕を重ねます</p>

<label for="track">トラックID または 運営からのURL</label>
<input id="track" placeholder="abc23xyz" autocomplete="off" spellcheck="false">
<button id="save">保存する</button>
<p id="msg" data-kind=""></p>

<div id="state">
  <div id="verdict" data-kind=""><span class="dot"></span><span id="verdictText">調べています…</span></div>
  <p id="fix"></p>
  <dl id="detail" hidden></dl>
  <button id="recheck" class="ghost">もう一度調べる</button>
</div>

<script src="popup.js"></script>
