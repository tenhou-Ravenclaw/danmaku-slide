<!doctype html>
<meta charset="utf-8">
<title>弾幕スライド</title>
<style>
  :root { color-scheme: dark;
    --bg:#0b0b0f; --surface:#15151d; --surface2:#1c1c26; --line:#2a2a38;
    --ink:#e8e8ef; --muted:#8a8a99; --accent:#6f8cff; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { padding:1.5rem; display:grid; gap:1rem; align-content:start; }
  h1 { margin:0; font-size:.72rem; font-weight:600; letter-spacing:.09em;
       text-transform:uppercase; color:var(--muted); }
  label { display:block; font-size:.75rem; color:var(--muted); margin-bottom:.3rem; }
  input, select { width:100%; padding:.6rem .75rem; border-radius:.5rem; font:inherit;
    background:var(--surface2); color:var(--ink); border:1px solid var(--line); }
  input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  button { padding:.7rem 1rem; border:0; border-radius:.5rem; font:inherit; font-weight:600; cursor:pointer;
    background:var(--accent); color:#0b0b12; width:100%; }
  button.ghost { background:var(--surface2); color:var(--ink); border:1px solid var(--line); }
  #msg { min-height:1.3rem; margin:0; font-size:.8rem; color:var(--muted); }
  #msg[data-kind="bad"] { color:#ff8f8f; }
  #msg[data-kind="ok"]  { color:#5fd39a; }
  .keys { margin:0; font-size:.75rem; color:var(--muted); line-height:1.9; }
  kbd { background:var(--surface2); border:1px solid var(--line); border-bottom-width:2px;
        border-radius:.3rem; padding:.05rem .35rem; font:inherit; font-size:.9em; }
  .running { display:none; }
  body[data-running="1"] .idle { display:none; }
  body[data-running="1"] .running { display:block; }
</style>

<body>
  <h1>弾幕スライド · 重ねる</h1>

  <div class="idle">
    <label for="track">トラックID または 投稿URL</label>
    <input id="track" placeholder="abc23xyz" autocomplete="off" spellcheck="false">
  </div>

  <div class="idle">
    <label for="display">重ねる画面</label>
    <select id="display"></select>
  </div>

  <p id="msg" data-kind=""></p>

  <button id="go" class="idle">スライドに重ねる</button>
  <button id="halt" class="running ghost">重ねるのをやめる</button>

  <p class="keys">
    <kbd id="k1">⌘⇧C</kbd> クリックを通すかどうかを切り替える<br>
    <kbd id="k2">⌘⇧X</kbd> 終了する
  </p>

<script>
  const $ = (id) => document.getElementById(id);
  const msg = (text, kind = '') => { $('msg').textContent = text; $('msg').dataset.kind = kind; };

  if (!navigator.platform.startsWith('Mac')) {
    $('k1').textContent = 'Ctrl+Shift+C';
    $('k2').textContent = 'Ctrl+Shift+X';
  }

  (async () => {
    for (const d of await window.shell.displays()) {
      const o = document.createElement('option');
      o.value = d.id; o.textContent = d.label; o.selected = d.primary;
      $('display').append(o);
    }
    $('track').focus();
  })();

  async function go() {
    $('go').disabled = true;
    const r = await window.shell.start({ track: $('track').value, displayId: $('display').value });
    $('go').disabled = false;
    if (!r.ok) { msg(r.reason, 'bad'); $('track').focus(); return; }
    msg(`${r.trackId} に重ねている`, 'ok');
    document.body.dataset.running = '1';
  }

  $('go').addEventListener('click', go);
  $('track').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  $('halt').addEventListener('click', async () => {
    await window.shell.stop();
    document.body.dataset.running = '';
    msg('');
    $('track').focus();
  });
</script>
</body>
