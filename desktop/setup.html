<!doctype html>
<meta charset="utf-8">
<title>弾幕スライド</title>
<style>
  /* 配信側（public/css/app.css）の暗い側と同じ色を使う。
     同じ製品の別の窓なので、見た目が揃っていないと別のアプリに見える。 */
  :root { color-scheme: dark;
    --bg:#0a0d13; --surface:#141821; --surface2:#1b2029; --line:#262c38; --line2:#3a4250;
    --ink:#e9edf4; --ink2:#aeb8c8; --muted:#8e98a9;
    --accent:#4fd3dd; --accent-ink:#04232a; --good:#4fd3dd; --bad:#ff8b8b; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { padding:1.5rem; display:grid; gap:1rem; align-content:start; }

  h1 { margin:0; font-size:1.1rem; font-weight:700; letter-spacing:-.02em; }
  .say { margin:.15rem 0 0; font-size:.8rem; color:var(--muted); }

  label { display:block; font-size:.75rem; color:var(--muted); margin-bottom:.3rem; }
  input, select { width:100%; padding:.6rem .75rem; border-radius:.5rem; font:inherit;
    background:var(--surface2); color:var(--ink); border:1px solid var(--line2); }
  input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }

  button { padding:.75rem 1rem; border:0; border-radius:.5rem; font:inherit; font-weight:700;
    cursor:pointer; background:var(--accent); color:var(--accent-ink); width:100%; }
  button:hover { filter:brightness(1.08); }
  button.ghost { background:var(--surface2); color:var(--ink); border:1px solid var(--line2); font-weight:600; }
  button.ghost:hover { background:var(--line); filter:none; }

  #msg { min-height:1.3rem; margin:0; font-size:.8rem; color:var(--muted); }
  #msg[data-kind="bad"] { color:var(--bad); }
  #msg[data-kind="ok"]  { color:var(--good); }

  /* 流しているあいだ。ここに居る人は窓の向こうを見ているので、文字は少なく。 */
  .live { display:flex; align-items:center; gap:.5rem; font-weight:700; color:var(--good); }
  .live .dot { width:.5rem; height:.5rem; border-radius:50%; background:var(--good);
               box-shadow:0 0 0 4px rgba(79,211,221,.18); }

  /* 運営のリンクから起動されたとき。貼る欄は引っ込め、受け取った中身を読む形で出す。
     欄の中に `b52bj39v a` と出ると、自分の貼り間違いにしか見えない。 */
  .got { display:none; }
  body[data-got="1"] .paste { display:none; }
  body[data-got="1"]:not([data-running="1"]) .got { display:block; }
  .got .say { margin:0 0 .5rem; color:var(--good); font-weight:700; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:.15rem .75rem; margin:0;
        padding:.6rem .75rem; border:1px solid var(--line); border-radius:.5rem;
        background:var(--surface); }
  .kv dt { font-size:.75rem; color:var(--muted); }
  .kv dd { margin:0; font-size:.85rem;
           font-family:ui-monospace, SFMono-Regular, Menlo, "Courier New", monospace; }

  .keys { margin:0; font-size:.75rem; color:var(--muted); line-height:1.9; }
  .keys a { color:var(--accent); }
  kbd { background:var(--surface2); border:1px solid var(--line2); border-bottom-width:2px;
        border-radius:.3rem; padding:.05rem .35rem; font:inherit; font-size:.9em; }
  hr { border:0; border-top:1px solid var(--line); margin:.2rem 0; }

  .running { display:none; }
  body[data-running="1"] .idle { display:none; }
  body[data-running="1"] .running { display:block; }
  body[data-running="1"] .live { display:flex; }
</style>

<body>
  <div>
    <h1>弾幕スライド</h1>
    <p class="say idle paste">運営から届いたリンクを貼ると、スライドの上に弾幕を流します。</p>
  </div>

  <div class="live running"><span class="dot"></span><span id="liveText">流しています</span></div>

  <div class="idle paste">
    <label for="track">運営からのリンク</label>
    <input id="track" placeholder="https://.../stage.html?e=…&t=…" autocomplete="off" spellcheck="false">
  </div>

  <div class="got">
    <p class="say">運営からのリンクを受け取りました。貼る必要はありません。</p>
    <dl class="kv">
      <dt>イベント</dt><dd id="gotEvent"></dd>
      <dt>トラック</dt><dd id="gotTrack"></dd>
    </dl>
  </div>

  <div class="idle">
    <label for="display">流す画面</label>
    <select id="display"></select>
  </div>

  <p id="msg" data-kind=""></p>

  <button id="go" class="idle">スライドに流す</button>
  <button id="halt" class="running ghost">流すのをやめる</button>

  <hr>

  <button id="quit" class="ghost">終了する</button>

  <p class="keys">
    スライドを全画面にすると、この窓は後ろに隠れる。<br>
    <kbd id="k2">⌘⇧X</kbd> で、窓に手が届かなくても終われる。
  </p>

  <p class="keys idle">
    リンクは運営から届きます。自分で運営もするなら
    <a href="#" id="console">イベントを作る画面</a>で配れます。
  </p>

<script>
  const $ = (id) => document.getElementById(id);
  const msg = (text, kind = '') => { $('msg').textContent = text; $('msg').dataset.kind = kind; };

  // 運営のリンクから渡ってきたトラック。入力欄には入れないので、ここで持つ。
  let received = null;
  // 受け取っていれば貼る欄は出ていない。最初に触る場所をそれに合わせる。
  const focusFirst = () => (received ? $('go') : $('track')).focus();

  if (!navigator.platform.startsWith('Mac')) $('k2').textContent = 'Ctrl+Shift+X';

  (async () => {
    const ds = await window.shell.displays();
    for (const d of ds) {
      const o = document.createElement('option');
      o.value = d.id; o.textContent = d.label;
      // 2枚以上あるなら投影先（メインでないほう）を既定にする
      o.selected = ds.length > 1 ? !d.primary : d.primary;
      $('display').append(o);
    }
    focusFirst();
  })();

  // 運営のリンクから起動されたとき。登壇者に貼らせないための経路。
  //
  // 入力欄には差し込まない。欄の中に `b52bj39v a` と並ぶと、受け取れたのではなく
  // 自分が貼り間違えたように見える。受け取れた事実と、受け取った中身を分けて出す。
  window.shell.onTrack?.((target) => {
    received = target;
    $('gotEvent').textContent = target.eventId;
    $('gotTrack').textContent = target.trackId;
    document.body.dataset.got = '1';
    msg('');
    $('go').focus();
  });

  async function go() {
    // 手で貼る経路は変えない。受け取ったぶんも parseTrackId が受け付ける形で渡す。
    const track = received ? `${received.eventId} ${received.trackId}` : $('track').value;
    $('go').disabled = true;
    const r = await window.shell.start({ track, displayId: $('display').value });
    $('go').disabled = false;
    if (!r.ok) { msg(r.reason, 'bad'); focusFirst(); return; }
    msg('');
    $('liveText').textContent = `${r.trackId} を流しています`;
    document.body.dataset.running = '1';
  }

  // 運営の画面はここで作る。弾幕ページそのものではないので、外のブラウザで開く。
  $('console').addEventListener('click', async (e) => {
    e.preventDefault();
    const origin = await window.shell.origin();
    window.shell.openExternal(`${origin}/organizer.html`);
  });

  $('quit').addEventListener('click', () => window.shell.quit());

  $('go').addEventListener('click', go);
  $('track').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  $('halt').addEventListener('click', async () => {
    await window.shell.stop();
    document.body.dataset.running = '';
    msg('');
    focusFirst();
  });
</script>
</body>
