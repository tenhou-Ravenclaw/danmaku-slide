name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Firestore のテスト（Rules と境界）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore エミュレータをキャッシュする
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm ci
      - run: npx firebase --version
      - run: npm run test:rules
      - run: npm run test:bus

  browser:
    name: 実ブラウザでの検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Firebase の設定はリポジトリに置かないので、CI では最小の偽物で足りる。
      # エミュレータに繋ぐだけなので apiKey は検証されない。
      - name: 設定を用意する
        run: |
          cat > .firebase-config.json <<'JSON'
          { "projectId": "df-hackathon-2026", "apiKey": "ci-fake-key", "authDomain": "localhost" }
          JSON
          node -e "
            const fs=require('fs');
            const c=JSON.parse(fs.readFileSync('.firebase-config.json','utf8'));
            fs.mkdirSync('public',{recursive:true});
            fs.writeFileSync('public/firebase-config.js',
              '// 生成物。編集しない。\nexport const firebaseConfig = '+JSON.stringify(c,null,2)+';\n');
          "
      - run: npm run test:browser

  unit:
    name: 弾幕エンジンのテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:unit

  shell:
    name: 透過シェルの設定
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Electron は画面が要る。CI では仮想ディスプレイの上で動かす。
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run --auto-servernum npm run test:shell

  guard:
    name: Rules の不変条件と生成物のガード
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run lint:rules

  secrets:
    name: 秘密情報スキャン
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: gitleaks を入れる
        run: |
          VER=8.30.1
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # 履歴を見る。一度コミットして消した鍵も検出対象。
      # 現在のツリーについては lint:rules の「生成物が追跡されていない」が担保する。
      - run: npm run lint:secrets

  audit:
    name: 依存の脆弱性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 配信されるコードが使う依存は moderate すら許さない
      - name: 本番依存（moderate 以上で落とす）
        run: npm audit --omit=dev --audit-level=moderate
      # 開発ツールは high 以上で落とす。firebase-tools 由来の moderate は受け入れている（CONTRIBUTING.md 参照）
      - name: 開発依存（high 以上で落とす）
        run: npm audit --audit-level=high
